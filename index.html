<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast Extraordinarios</title>
    <style>
        body { background-color: #0B162C; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: Arial, sans-serif; }
        .contenedor-podcast { position: relative; width: 100%; max-width: 800px; border-radius: 15px; overflow: hidden; box-shadow: 0px 15px 40px rgba(0,0,0,0.6); }
        .imagen-fondo { width: 100%; display: block; }
        audio { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 85%; }
    </style>
</head>
<body>
    <div class="contenedor-podcast">
        <img src="image.png" alt="Portada Podcast" class="imagen-fondo">
        <!-- Reproductor de MP3 más compatible -->
        <audio controls>
            <source src="clase1.mp3" type="audio/mpeg">
            Tu navegador no soporta el audio.
        </audio>
    </div>
</body>
</html>
